<!-- Overview -->
<h2 class="py-2">لية تختار كــــــــــــارد</h2>
<section class="overview" id="overview">
    @for (item of items; track $index) {
        <div [ngClass]="{'card': true, 'card-special': ($index + 1) % 2 === 0}">
            <i class="fa-solid fa-gem"></i>
            <h4>{{ item.title }}</h4>
            <p class="title">
                {{ item.paragraph }}
            </p>
        </div>        
    }
</section>
