<div class="data-holder">
    <div class="Shapes_dots__1jMPc">
    </div>
    <div class="Shapes_dots__bottom">
    </div>
    <div class="container-size">
        <p-breadcrumb class="max-w-full page-header" [model]="items" [home]="home">
            <ng-template #item let-item>
                <a class="cursor-pointer" [routerLink]="item.routerLink">
                    {{item.label}}
                    <i [class]="item.icon"></i>
                </a>
            </ng-template>
            <ng-template #separator> / </ng-template>
        </p-breadcrumb>

        <div class="page-title">
            <h2>تسجيل بيانات شكوى - او استفسار</h2>
            <p>املأ النموذج أدناه لإرسال رسالتك بشكل صحيح</p>
        </div>
        <div class="form-group">
            <div class="input-container">
                <label for="name">الإسم ثلاثي: </label>
                    <input pInputText id="name" [(ngModel)]="name.value" class="w-100" autocomplete="off" required
                        (change)="checkValidation(name)" />
                <!-- Validation messages -->
                @if(name.empty) {
                <small class="danger">يجب ادخال الاسم</small>
                }@else if(name.invalid) {
                <small class="danger">{{name.errorMessage}}</small>
                }
            </div>
        </div>

        <div class="form-group">
            <div class="input-container">
                    <label for="names">المدينة: </label>
                    <p-select [options]="cities" [(ngModel)]="selectedCity" optionLabel="name"
                        placeholder="Select a city" class="w-100" />
            </div>
            <div class="input-container">
                    <label for="district">الحي: </label>
                    <input pInputText id="district" [(ngModel)]="district.value" class="w-100" autocomplete="off" required
                        (change)="checkValidation(district)" />
                <!-- Validation messages -->
                @if(district.empty) {
                <small class="danger">يجب ادخال الحي</small>
                }
            </div>
        </div>

        <div class="form-group">
            <div class="input-container">
                <label for="requestTypes">نوع الطلب: </label>
                    <p-select [options]="requestTypes" id="requestTypes" [(ngModel)]="selectedRequestType"
                        optionLabel="name" placeholder="Select a gender" class="w-100" />
                
            </div>

            <div class="input-container">
                <label for="phone">رقم الهاتف</label>
                    <input pInputText id="phone" placeholder="0523121232" min="10" max="10" [(ngModel)]="phone" class="w-100 ltr" autocomplete="off" required
                        (change)="checkValidation(phone)" />
                <!-- <input pInputText id="phoneKey" value="+966" disabled autocomplete="off" required class="phone-key" /> -->
            </div>
        </div>

        <div class="form-group">
            <div class="input-container">
                <label for="notes">اضافة ملاحظات: </label>
                <textarea pTextarea id="notes" class="w-100 text-area" style="resize: none" [(ngModel)]="notes.value"
                    autocomplete="off" required (change)="checkValidation(notes)"></textarea>
            </div>
        </div>

        <p>*جميع الشكاوى تخضع لرقابة مباشرة من الإدارة العامة</p>

        <div class="submit-container">
            <p-button label="إرسال الطلب" (onClick)="addFeedback()" />
        </div>
    </div>
    <p-toast [showTransformOptions]="'translateY(100%)'" [showTransitionOptions]="'1000ms'" [hideTransitionOptions]="'1000ms'" [showTransformOptions]="'translateX(100%)'" />
</div>
