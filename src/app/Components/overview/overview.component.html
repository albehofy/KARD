<!-- Overview -->
<h2 class="py-2">{{whyToChooseCard}}</h2>
<section class="overview" id="overview">
    @for (item of items; track $index) {

        <div [ngClass]="{'card': true, 'card-special': ($index + 1) % 2 === 0}">
            @if ($index == 0) {
                <i class="fa-solid fa-star"></i> <!-- الجودة -->
            }@else if ($index == 1) {
                <!-- <i class="fa-solid fa-ruler-combined"></i> الدقة -->
                 <i class="fa-solid fa-crosshairs"></i> <!-- الدقة -->

            }
            @else if ($index == 2) {
                <i class="fa-solid fa-shield"></i> <!-- الضمان -->            }
            <h4>{{ item.title }}</h4>
            <p class="title">
                {{ item.paragraph }}
            </p>
        </div>        
    }
</section>
